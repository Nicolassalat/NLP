# uv run wandb sweep sweeps/rnn.yaml, then: uv run wandb agent --count 8 <sweep-id>
# Epochs are capped; early stopping usually ends a run before that.
program: abductive/train.py
command: [uv, run, python, -m, abductive.train, --model, rnn, --epochs, "20"]
method: bayes
metric:
  name: val/acc
  goal: maximize
parameters:
  cell:
    values: [lstm, gru]
  pooling:
    values: [last, max]
  rnn_hidden:
    values: [128, 256]
  lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.003
  dropout:
    values: [0.1, 0.3]
